[package]
name = "difuzz"
version = "0.1.0"
edition = "2021"
publish = false
description = "Fuzzer diferencial de minifiers de JavaScript: corre cada caso original y minificado bajo node y compara las salidas. Backends: oxc (por defecto) y swc."

# Crates publicados, versiones fijas. El Cargo.lock va commiteado (delta v1.2 §4.5).
# swc_ecma_testing / testing no estan: runner propio (delta v1.2 §1 §3.3).
[dependencies]
swc_common               = "26.0.0"
swc_ecma_ast             = "29.0.2"
swc_ecma_codegen         = "32.0.3"
swc_ecma_minifier        = "61.0.8"
swc_ecma_parser          = "45.1.4"
swc_ecma_transforms_base = "49.0.1"
swc_ecma_visit           = "29.0.0"

# Backend oxc (src/backend/oxc.rs). Mismas versiones en todos los crates oxc_*.
oxc_allocator = "=0.153.0"
oxc_codegen   = "=0.153.0"
oxc_minifier  = "=0.153.0"
oxc_parser    = "=0.153.0"
# M19: SemanticBuilder::with_check_syntax_error (errores tempranos que el parser
# deja a la semantica). Ya estaba en Cargo.lock como dependencia de oxc_minifier.
oxc_semantic  = "=0.153.0"
oxc_span      = "=0.153.0"

# M2: kill(-pgid) para matar el grupo de procesos del programa (hijos que heredan
# el stdout). Ya estaba en Cargo.lock como dependencia transitiva (0.2.189).
libc = "0.2"

# Los ganchos de diagnostico del minifier (debug_assert_valid, SWC_CHECK, SWC_RUN)
# solo existen con debug_assertions. Release por velocidad, asserts por senal (delta v1.2 §2.3).
[profile.release]
debug-assertions = true

# R1-H05: el oraculo. El mismo codigo SIN debug assertions, como el paquete npm.
# Un debug_assert! de oxc (p. ej. compression_pass.rs:167-190) puede tapar un
# miscompile que npm si produce. Si el hijo minificador hace panic, difuzz
# re-minifica el caso con este binario (subproceso.rs, "oraculo"):
#   cargo build --release && cargo build --profile oraculo
# deja target/release/difuzz y target/oraculo/difuzz; el primero encuentra al
# segundo solo (o con DIFUZZ_ORACULO=<ruta>).
[profile.oraculo]
inherits = "release"
debug-assertions = false
